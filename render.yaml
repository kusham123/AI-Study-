services:
  - type: web
    name: ai-study-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - { key: DB_HOST, sync: false }      # AWS RDS MySQL endpoint
      - { key: DB_NAME, sync: false }
      - { key: DB_USER, sync: false }
      - { key: DB_PASS, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: AI_API_KEY, sync: false }
      - { key: AI_BASE_URL, sync: false }
      - { key: AI_MODEL, sync: false }
      - { key: CLIENT_URL, sync: false }
  - type: web
    name: ai-study-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_URL, sync: false }  # https://ai-study-api.onrender.com/api
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
